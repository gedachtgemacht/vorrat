/* gedacht.gemacht. base, gemeinsam für zähler. vorrat. beleg. */
:root{
  --bg:#0d0d10; --s1:#15151a; --s2:#1c1c23; --s3:#25252e; --line:#2a2a33;
  --tx:#ecebf2; --mu:#8b8a97; --mu2:#5f5e6a;
  --ac:#9b8afb; --ac2:#7d6bf0; --acbg:rgba(155,138,251,.13);
  --ok:#5fd39a; --okbg:rgba(95,211,154,.13);
  --wa:#f2c25c; --wabg:rgba(242,194,92,.13);
  --ba:#f2777a; --babg:rgba(242,119,122,.13);
  --r:14px; --r2:10px;
  --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --navh:64px;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f6f5f9; --s1:#ffffff; --s2:#f0eef6; --s3:#e5e2ef; --line:#e1dfe9;
  --tx:#17161c; --mu:#6c6a78; --mu2:#9a98a6;
  --ac:#6d5ae6; --ac2:#5a47d6; --acbg:rgba(109,90,230,.10);
  --ok:#1f9d63; --okbg:rgba(31,157,99,.10);
  --wa:#b7820f; --wabg:rgba(183,130,15,.11);
  --ba:#d6454a; --babg:rgba(214,69,74,.10);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
.app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 24px)}
.app.nonav{padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}

/* Kopf */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{font:600 20px/1 var(--mono);letter-spacing:-.02em;margin-right:auto}
.brand b{color:var(--ac);font-weight:600}
.bar .sub{font:12px var(--mono);color:var(--mu);margin-left:2px}
.view{padding:4px 16px 0}
.h{font:600 13px var(--mono);color:var(--mu);text-transform:lowercase;letter-spacing:.02em;margin:22px 2px 10px;display:flex;align-items:center;gap:8px}
.h .r{margin-left:auto;font-weight:400}

/* Karten */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card.tight{padding:12px 14px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.muted{color:var(--mu)} .mu2{color:var(--mu2)}
.small{font-size:13px} .tiny{font-size:12px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font:600 34px/1.05 var(--mono);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.mid{font:600 22px/1.1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ok{color:var(--ok)} .wa{color:var(--wa)} .ba{color:var(--ba)} .ac{color:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:var(--r2);padding:10px 12px}
.stat .k{font:12px var(--mono);color:var(--mu)}
.stat .v{font:600 17px var(--mono);margin-top:2px;font-variant-numeric:tabular-nums}
.sep{height:1px;background:var(--line);margin:12px 0}
.flex{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wrap{flex-wrap:wrap}
.right{margin-left:auto}

/* Liste */
.list{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--s2)}
.item .m{flex:1;min-width:0}
.item .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .e{text-align:right;flex:none}
.thumb{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--s3);flex:none;display:grid;place-items:center;color:var(--mu);font:600 15px var(--mono)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--mu2)}
.dot.ok{background:var(--ok)} .dot.wa{background:var(--wa)} .dot.ba{background:var(--ba)} .dot.ac{background:var(--ac)}

/* Chips und Segmente */
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12px var(--mono);padding:4px 9px;border-radius:99px;background:var(--s3);color:var(--mu);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)} .chip.wa{background:var(--wabg);color:var(--wa)} .chip.ba{background:var(--babg);color:var(--ba)} .chip.ac{background:var(--acbg);color:var(--ac)}
.seg{display:flex;background:var(--s2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font:500 13px var(--sans);color:var(--mu);white-space:nowrap;cursor:pointer}
.seg button.on{background:var(--s1);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.25)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--s2);padding:11px 16px;border-radius:12px;font-weight:500;cursor:pointer;min-height:44px;text-decoration:none;color:var(--tx)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--ac);border-color:var(--ac);color:#0d0d10;font-weight:600}
:root[data-theme=light] .btn.primary{color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--mu)}
.btn.danger{color:var(--ba);background:var(--babg);border-color:transparent}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--mu);display:grid;place-items:center;cursor:pointer}
.icon-btn:active{background:var(--s2)}
.icon-btn svg,.btn svg,.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.fab{position:fixed;z-index:30;right:max(16px,calc(50vw - 264px));bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 16px);width:58px;height:58px;border-radius:18px;border:0;background:var(--ac);color:#0d0d10;display:grid;place-items:center;box-shadow:0 8px 24px rgba(125,107,240,.35);cursor:pointer}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.nonav .fab{bottom:calc(env(safe-area-inset-bottom) + 20px)}

/* Untere Navigation */
.tabs{position:fixed;z-index:25;left:0;right:0;bottom:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--s1) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;height:var(--navh);border:0;background:none;color:var(--mu2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 11px var(--mono);cursor:pointer}
.tabs button.on{color:var(--ac)}

/* Formular */
.field{display:block;margin:0 0 12px}
.field>span{display:block;font:500 12px var(--mono);color:var(--mu);margin:0 0 6px 2px}
.field small{display:block;color:var(--mu2);font-size:12px;margin:5px 2px 0}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--line);border-radius:11px;padding:12px 13px;min-height:46px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acbg)}
input[type=number],input.mono{font-family:var(--mono)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac)}
textarea{min-height:80px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;padding:6px 2px;margin-bottom:8px}

/* Sheet (Dialog von unten) */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;background:var(--s1);color:var(--tx);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
dialog.sheet::backdrop{background:rgba(5,5,8,.6);backdrop-filter:blur(3px)}
dialog.sheet[open]{animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:9px auto 2px}
.sheet .sh{display:flex;align-items:center;padding:8px 12px 4px 18px}
.sheet .sh h2{font:600 17px var(--sans);margin:0;flex:1}
.sheet .sb{padding:8px 18px calc(env(safe-area-inset-bottom) + 18px);overflow:auto;max-height:calc(92dvh - 60px)}

/* Diverses */
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 90px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:14px;z-index:100;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 24px;color:var(--mu)}
.empty .ico{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;background:var(--acbg);color:var(--ac);display:grid;place-items:center}
.empty .ico svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h3{color:var(--tx);margin:0 0 6px;font-size:17px}
.empty p{margin:0 0 18px;font-size:14px}

<script>/* gedacht.gemacht. core: lokaler Speicher, Formatierung, Kalender, Export. Keine Netzwerkzugriffe. AGPL-3.0 */
(function () {
  'use strict';
  const gg = {};

  /* ---------- IndexedDB ---------- */
  // openDB('zaehler', ['meters','readings','blobs','meta']) -> {all,get,put,del,clear,names}
  gg.openDB = function (name, stores, version) {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('gg-' + name, version || 1);
      rq.onupgradeneeded = () => {
        const db = rq.result;
        stores.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' }); });
      };
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        const db = rq.result;
        const tx = (s, mode, fn) => new Promise((ok, ko) => {
          const t = db.transaction(s, mode); const st = t.objectStore(s); let out;
          const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
          t.oncomplete = () => ok(out); t.onerror = () => ko(t.error); t.onabort = () => ko(t.error);
        });
        res({
          db, names: stores,
          all: s => tx(s, 'readonly', st => st.getAll()),
          get: (s, id) => tx(s, 'readonly', st => st.get(id)),
          put: (s, obj) => tx(s, 'readwrite', st => st.put(obj)).then(() => obj),
          del: (s, id) => tx(s, 'readwrite', st => st.delete(id)),
          clear: s => tx(s, 'readwrite', st => st.clear())
        });
      };
    });
  };

  gg.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  gg.esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  gg.$ = (sel, el) => (el || document).querySelector(sel);
  gg.$$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));

  /* ---------- Zahlen und Daten (de-DE) ---------- */
  const nf = (d) => new Intl.NumberFormat('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
  gg.num = (n, d = 0) => (n == null || isNaN(n)) ? '·' : nf(d).format(n);
  gg.eur = (n, d = 2) => (n == null || isNaN(n)) ? '·' : nf(d).format(n) + ' €';
  gg.parseNum = s => { if (typeof s === 'number') return s; s = String(s || '').trim().replace(/\s/g, ''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); return parseFloat(s); };
  gg.today = () => gg.iso(new Date());
  gg.iso = d => { const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); };
  gg.d = iso => { const [y, m, dd] = String(iso).slice(0, 10).split('-').map(Number); return new Date(y, m - 1, dd, 12); };
  gg.date = iso => iso ? gg.d(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '·';
  gg.dateShort = iso => iso ? gg.d(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) : '·';
  gg.dateLong = iso => iso ? gg.d(iso).toLocaleDateString('de-DE', { day: 'numeric', month: 'long', year: 'numeric' }) : '·';
  gg.month = iso => gg.d(iso).toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
  gg.days = (a, b) => Math.round((gg.d(b) - gg.d(a)) / 864e5); // b minus a in Tagen
  gg.addDays = (iso, n) => { const x = gg.d(iso); x.setDate(x.getDate() + n); return gg.iso(x); };
  gg.addMonths = (iso, n) => { const x = gg.d(iso); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(day, last)); return gg.iso(x); };
  gg.relDays = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : n === -1 ? 'gestern' : n > 0 ? 'in ' + n + ' Tagen' : 'vor ' + (-n) + ' Tagen';

  /* ---------- Bilder ---------- */
  // Verkleinert Fotos lokal (Canvas), damit der Speicher nicht vollläuft.
  gg.compress = (file, max = 1600, q = 0.8) => new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      let { width: w, height: h } = img; const k = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Bild konnte nicht gelesen werden')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Bild konnte nicht gelesen werden')); };
    img.src = url;
  });

  gg.blobUrl = (key, blob) => { if (!blob) return ''; if (urls.has(key)) return urls.get(key); const u = URL.createObjectURL(blob); urls.set(key, u); return u; };
  gg.blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
  gg.dataURLToBlob = async d => (await fetch(d)).blob();

  /* ---------- Dateien ---------- */
  gg.download = (filename, data, mime) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || 'application/octet-stream' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  };
  // Teilen über das Handy (Teilen-Menü), sonst Download.
  gg.shareFile = async (filename, data, mime) => {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    try {
      const f = new File([blob], filename, { type: mime || blob.type });
      if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return true; }

  gg.csv = rows => '\ufeff' + rows.map(r => r.map(v => {

    v = v == null ? '' : String(v);

  /* ---------- Kalender (.ics) ---------- */

  // ev: {uid, title, date:'YYYY-MM-DD', desc, alarm:[Tage vorher...], rrule:'FREQ=MONTHLY'}
  const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const fold = l => { const out = []; while (l.length > 74) { out.push(l.slice(0, 74)); l = ' ' + l.slice(74); } out.push(l); return out.join('\r\n'); };
  gg.ics = (calName, events) => {
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');

      (e.alarm || [0]).forEach(n => { const h = n * 24 - 9; L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.title), 'TRIGGER:' + (h > 0 ? '-PT' + h + 'H' : 'PT' + (-h) + 'H'), 'END:VALARM'); });

  // Hinweis: TRIGGER ohne Minus bei 0 Tagen = am Tag um 9 Uhr (ganztägiger Termin startet 0 Uhr).

  /* ---------- Sicherung ---------- */
  // Exportiert alle Stores inkl. Blobs als eine JSON Datei.
  gg.backupExport = async (app, db) => {
    const out = { app, version: 1, exported: new Date().toISOString(), stores: {} };
    for (const s of db.names) {
      const rows = await db.all(s);
      out.stores[s] = await Promise.all(rows.map(async r => {
        const c = { ...r };
        for (const k of Object.keys(c)) if (c[k] instanceof Blob) c[k] = { __blob: await gg.blobToDataURL(c[k]) };
        return c;
      }));
    }
    return JSON.stringify(out);
  };
  gg.backupImport = async (app, db, text) => {
    const data = JSON.parse(text);
    if (data.app !== app) throw new Error('Diese Sicherung gehört zu ' + (data.app || 'einer anderen App'));
    for (const s of db.names) {
      if (!data.stores[s]) continue;
      await db.clear(s);
      for (const r of data.stores[s]) {
        for (const k of Object.keys(r)) if (r[k] && r[k].__blob) r[k] = await gg.dataURLToBlob(r[k].__blob);
        await db.put(s, r);
      }
    }
  };
  gg.pickFile = (accept, capture) => new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept || '*/*'; if (capture) i.setAttribute('capture', capture);
    i.onchange = () => res(i.files[0] || null); i.click();
  });

  /* ---------- UI Helfer ---------- */
  let tt;
  gg.toast = msg => {
    let t = gg.$('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400);
  };
  // gg.sheet(title, html) öffnet ein Bottom Sheet und gibt das Element zurück.
  gg.sheet = (title, html, onClose) => {
    const d = document.createElement('dialog'); d.className = 'sheet';
    d.innerHTML = '<div class="grab"></div><div class="sh"><h2>' + gg.esc(title) + '</h2><button class="icon-btn" data-close aria-label="Schließen">' + gg.icon('x') + '</button></div><div class="sb">' + html + '</div>';
    document.body.appendChild(d);
    d.addEventListener('click', e => { if (e.target === d || e.target.closest('[data-close]')) d.close(); });
    d.addEventListener('close', () => { d.remove(); onClose && onClose(); });
    d.showModal(); return d;
  };
  gg.confirm = (msg, yes = 'Löschen', danger = true) => new Promise(res => {
    let v = false;
    const d = gg.sheet('Sicher?', '<p class="muted" style="margin:4px 0 8px">' + gg.esc(msg) + '</p><div class="btns"><button class="btn" data-close>Abbrechen</button><button class="btn ' + (danger ? 'danger' : 'primary') + '" data-yes>' + gg.esc(yes) + '</button></div>', () => res(v));
    d.querySelector('[data-yes]').onclick = () => { v = true; d.close(); };
  });
  gg.haptic = (ms = 10) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

  /* ---------- Icons (Linien, 24er Raster) ---------- */
  const P = {
    plus: '<path d="M12 5v14M5 12h14"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>',
    home: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
    list: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
    chart: '<path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    camera: '<path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/>',
    scan: '<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 9v6M10 9v6M13 9v6M16 9v6"/>',
    cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
    bolt: '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>', flame: '<path d="M12 21c4 0 7-2.7 7-6.5 0-3-2-5.5-4-7.5 0 2.5-1.5 4-3 4 0-3-1-6-4-8 .5 3.5-3 6-3 11 0 4 3 7 7 7z"/>',
    drop: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>', heat: '<path d="M7 4v16M12 4v16M17 4v16M4 20h16"/>',
    box: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
    receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    shield: '<path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', share: '<path d="M12 3v12M7 8l5-5 5 5M5 14v5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5"/>',
    download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', upload: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
    search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>', check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
    clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>', alert: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
    leaf: '<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l8-8"/>', back: '<path d="M15 5l-7 7 7 7"/>',
    more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>', minus: '<path d="M5 12h14"/>',

  };
  gg.icon = n => '<svg viewBox="0 0 24 24" aria-hidden="true">' + (P[n] || '') + '</svg>';

  /* ---------- Theme, Speicher, Offline ---------- */
  gg.theme = t => { try { if (t) localStorage.setItem('gg-theme', t); t = t || localStorage.getItem('gg-theme') || 'dark'; } catch (e) { t = t || 'dark'; } document.documentElement.dataset.theme = t; return t; };
  gg.persist = async () => { try { if (navigator.storage && navigator.storage.persist) return await navigator.storage.persist(); } catch (e) {} return false; };
  gg.sw = () => { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {}); };
  gg.storageInfo = async () => { try { const e = await navigator.storage.estimate(); return e; } catch (e) { return null; } };

  window.gg = gg;
})();

// Schnelle Datumseingabe: 251226, 25122026, 2512, 25.12.26, 25.12., 12.2027 (Monat/Jahr), 2026-12-25
function parseDate(s, past) {
  s = String(s || '').trim(); if (!s) return null;
  const t = today(); let d, m, y;
  if (/^\d+$/.test(s)) {
    if (s.length === 4) { d = +s.slice(0, 2); m = +s.slice(2); }
    else if (s.length === 6) { d = +s.slice(0, 2); m = +s.slice(2, 4); y = 2000 + +s.slice(4); }
    else if (s.length === 8) { d = +s.slice(0, 2); m = +s.slice(2, 4); y = +s.slice(4); }
    else return null;
  } else if (/^\d{4}-\d{2}-\d{2}$/.test(s)) { [y, m, d] = s.split('-').map(Number); }
  else {
    const p = s.split(/[.\/\-\s,]+/).filter(Boolean);
    if (!p.length || p.some(x => !/^\d+$/.test(x))) return null;
    if (p.length === 2 && p[1].length === 4) { m = +p[0]; y = +p[1]; if (m < 1 || m > 12 || y < 2000 || y > 2100) return null; return gg.iso(new Date(y, m, 0, 12)); }
    if (p.length < 2 || p.length > 3) return null;
    d = +p[0]; m = +p[1]; if (p[2] != null) { y = +p[2]; if (p[2].length <= 2) y += 2000; }
  }
  const auto = y == null; if (auto) y = +t.slice(0, 4);
  const ok = (yy) => { const x = new Date(yy, m - 1, d, 12); return x.getFullYear() === yy && x.getMonth() === m - 1 && x.getDate() === d ? gg.iso(x) : null; };
  let r = ok(y); if (!r) return null;
  if (auto && !past && r < t) r = ok(y + 1);
  if (auto && past && r > t) r = ok(y - 1);
  if (!r || y < 2000 || y > 2100) return null;
  return r;
}

/* ---------- Barcodes: Prüfziffer, UPC-E ---------- */
function gtinOk(s) {
  if (!/^\d{8}$|^\d{12,14}$/.test(s)) return false;
  const a = s.split('').map(Number), c = a.pop(); let sum = 0;
  for (let i = a.length - 1, w = 3; i >= 0; i--, w = 4 - w) sum += a[i] * w;
  return (10 - sum % 10) % 10 === c;
}
function upcE2A(s) {
  if (!/^[01]\d{7}$/.test(s)) return null;
  const n = s[0], x = s.slice(1, 7), c = s[7], l = x[5]; let b;
  if ('012'.includes(l)) b = x[0] + x[1] + l + '0000' + x[2] + x[3] + x[4];
  else if (l === '3') b = x[0] + x[1] + x[2] + '00000' + x[3] + x[4];
  else if (l === '4') b = x[0] + x[1] + x[2] + x[3] + '00000' + x[4];
  else b = x[0] + x[1] + x[2] + x[3] + x[4] + '0000' + l;
  return n + b + c;
}
// Gibt eine gültige, einheitliche Nummer zurück (UPC-A wird zu EAN-13) oder null.
function normCode(raw, fmt) {
  const s = String(raw || '').replace(/\D/g, ''); fmt = String(fmt || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  if (s.length === 13) return gtinOk(s) ? s : null;
  if (s.length === 12) return gtinOk(s) ? '0' + s : null;
  if (s.length === 8) {
    if (fmt === 'upce') { const a = upcE2A(s); return a && gtinOk(a) ? s : null; }
    if (gtinOk(s)) return s;
    const a = upcE2A(s); return a && gtinOk(a) ? s : null;
  }
  return null;
}

/* ---------- Barcode lesen (BarcodeDetector, sonst eingebettetes ZXing) ---------- */
let detector = null, detTried = false;
async function getDetector() {
  if (detTried) return detector; detTried = true;
  try {
    if ('BarcodeDetector' in window) {
      const f = await window.BarcodeDetector.getSupportedFormats();
      const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e'].filter(x => f.includes(x));
      if (want.length) detector = new window.BarcodeDetector({ formats: want });
    }
  } catch (e) { detector = null; }
  return detector;
}
function zxCanvas(cv, hard) {
  const Z = window.ZXV; if (!Z) return null;
  const w = cv.width, h = cv.height, px = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  const lum = new Uint8ClampedArray(w * h);
  for (let i = 0, j = 0; i < lum.length; i++, j += 4) lum[i] = (px[j] * 77 + px[j + 1] * 150 + px[j + 2] * 29) >> 8;
  const src = new Z.RGBLuminanceSource(lum, w, h);
  const F = Z.BarcodeFormat, hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E]);
  if (hard) hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const rd = new Z.MultiFormatUPCEANReader(hints);
  for (const B of [Z.HybridBinarizer, Z.GlobalHistogramBinarizer]) {
    try {
      const r = rd.decode(new Z.BinaryBitmap(new B(src)), hints);
      const fm = { [F.EAN_13]: 'ean_13', [F.EAN_8]: 'ean_8', [F.UPC_A]: 'upc_a', [F.UPC_E]: 'upc_e' }[r.getBarcodeFormat()];
      const n = normCode(r.getText(), fm); if (n) return n;
    } catch (e) { /* nichts gefunden */ }
  }
  return null;
}
function drawTo(src, sw, sh, max, rot, crop) {
  crop = crop || [0, 0, sw, sh];
  const k = Math.min(1, max / Math.max(crop[2], crop[3]));
  const w = Math.round(crop[2] * k), h = Math.round(crop[3] * k);
  const c = document.createElement('canvas'); c.width = rot ? h : w; c.height = rot ? w : h;
  const x = c.getContext('2d', { willReadFrequently: true });
  if (rot) { x.translate(h, 0); x.rotate(Math.PI / 2); }
  x.drawImage(src, crop[0], crop[1], crop[2], crop[3], 0, 0, w, h); return c;
}
// Liest einen Barcode aus einem Bild (Datei, Blob, img oder canvas). Auch für Tests nutzbar.
async function decodeImage(input) {
  let img = input;
  if (input instanceof Blob) {
    img = await new Promise((ok, ko) => { const u = URL.createObjectURL(input); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); ok(i); }; i.onerror = () => { URL.revokeObjectURL(u); ko(new Error('Bild unlesbar')); }; i.src = u; });
  }
  const w = img.naturalWidth || img.videoWidth || img.width, h = img.naturalHeight || img.videoHeight || img.height;
  const det = await getDetector();
  if (det) { try { for (const b of await det.detect(img)) { const n = normCode(b.rawValue, b.format); if (n) return n; } } catch (e) { /* weiter mit ZXing */ } }
  for (const max of [1200, 700]) for (const rot of [false, true]) { const n = zxCanvas(drawTo(img, w, h, max, rot), true); if (n) return n; }
  return null;
}

/* ---------- Open Food Facts (optional, einziger Netzwerkzugriff) ---------- */
async function lookupOFF(code) {
  if (!S.set.off || navigator.onLine === false) return null;
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 4000);
  try {
    const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,product_name_de,brands,quantity', { signal: ac.signal, credentials: 'omit', referrerPolicy: 'no-referrer', cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json(); const p = j && j.product; if (!p) return null;
    let n = String(p.product_name_de || p.product_name || '').trim(); if (!n) return null;
    const b = String(p.brands || '').split(',')[0].trim();
    if (b && !n.toLowerCase().includes(b.toLowerCase())) n += ', ' + b;
    const q = String(p.quantity || '').trim(); if (q && q.length <= 12) n += ', ' + q;
    return n.slice(0, 80);
  } catch (e) { return null; } finally { clearTimeout(t); }
}

/* ---------- Statistik ---------- */
function monthKeys(n) { const out = []; let x = today().slice(0, 7) + '-15'; for (let i = 0; i < n; i++) { out.unshift(x.slice(0, 7)); x = gg.addMonths(x, -1); } return out; }
const sumBy = (rows, type) => rows.filter(r => r.type === type).reduce((a, r) => a + (r.qty || 1), 0);
const pct = (u, w) => u + w ? Math.round(u / (u + w) * 100) : null;
function niceMax(v) { if (v <= 4) return 4; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return v; }
function barPath(x, y, w, h) { const r = Math.min(4, h / 2, w / 2); return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + 'V' + (y + h) + 'Z'; }
function chart(ms) {
  const W = 340, H = 156, top = 16, bot = 24, L = 2, R = 26;
  const max = niceMax(Math.max(1, ...ms.flatMap(m => [m.u, m.w])));
  const ph = H - top - bot, gw = (W - L - R) / ms.length, bw = Math.min(15, (gw - 18) / 2);
  const y = v => top + ph - v / max * ph;
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Verbraucht und weggeworfen je Monat">';
  ms.forEach((m, i) => { if (m.k === ui.month) s += '<rect class="hl" x="' + (L + i * gw + 3) + '" y="' + (top - 10) + '" width="' + (gw - 6) + '" height="' + (ph + 10 + bot - 2) + '" rx="8"/>'; });
  [max / 2, max].forEach(v => { s += '<line x1="' + L + '" x2="' + (W - R + 4) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-dasharray="2 4"/><text x="' + (W - 2) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + gg.num(v) + '</text>'; });
  ms.forEach((m, i) => {
    const cx = L + i * gw + gw / 2, x1 = cx - bw - 1, x2 = cx + 1;
    s += '<g class="g" data-m="' + m.k + '"><title>' + m.label + ': ' + m.u + ' verbraucht, ' + m.w + ' weggeworfen</title>';
    s += '<rect x="' + (L + i * gw) + '" y="0" width="' + gw + '" height="' + H + '" fill="transparent"/>';
    if (m.u) s += '<path d="' + barPath(x1, y(m.u), bw, top + ph - y(m.u)) + '" fill="var(--ok)"/>';
    if (m.w) s += '<path d="' + barPath(x2, y(m.w), bw, top + ph - y(m.w)) + '" fill="var(--ba)"/>';
    s += '<text x="' + cx + '" y="' + (H - 6) + '" text-anchor="middle"' + (m.k === ui.month ? ' style="fill:var(--tx)"' : '') + '>' + m.short + '</text></g>';
  });
  s += '<line x1="' + L + '" x2="' + (W - R + 4) + '" y1="' + (top + ph) + '" y2="' + (top + ph) + '" stroke="var(--mu2)"/>';
  return s + '</svg>';
}

/* ---------- Scanner ---------- */
async function openScanner(onCode) {
  let stream = null, alive = true, timer = 0, last = '', busy = false;
  const cam = !!(window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const d = gg.sheet('Barcode scannen',
    '<div class="scan' + (cam ? '' : ' hide') + '" id="scBox"><video playsinline muted autoplay></video><div class="frame"><i></i></div><div class="sstat" id="scSt">Kamera startet</div></div>' +
    '<div class="note' + (cam ? ' hide' : '') + '" id="scNo">' + (window.isSecureContext ? 'Dieser Browser gibt keinen Zugriff auf die Kamera.' : 'Die Kamera geht nur über eine sichere Verbindung (HTTPS).') + ' Du kannst ein Foto vom Barcode wählen oder die Nummer eintippen.</div>' +
    '<label class="lbl" for="scIn">Nummer unter dem Barcode</label><div class="dwrap"><input id="scIn" class="mono" inputmode="numeric" placeholder="8 oder 13 Ziffern" maxlength="14" autocomplete="off" enterkeyhint="done"><button class="btn primary" id="scOk">Übernehmen</button></div><div class="prev" id="scErr"></div>' +
    '<button class="btn block" id="scPic" style="margin-top:12px">' + ic('image') + 'Foto vom Barcode wählen</button>',
    () => { alive = false; stop(); });
  const v = $('video', d), stx = t => { const e = $('#scSt', d); if (e) e.textContent = t; };
  function stop() { clearTimeout(timer); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; try { v.srcObject = null; } catch (e) {} }
  function hit(code) { if (!alive) return; alive = false; gg.haptic(40); stop(); d.close(); onCode(code); }
  function noCam(msg) { $('#scBox', d).classList.add('hide'); const n = $('#scNo', d); n.classList.remove('hide'); n.textContent = msg; }
  const err = t => { const e = $('#scErr', d); e.className = 'prev bad'; e.textContent = t; };
  $('#scOk', d).onclick = () => { const n = normCode($('#scIn', d).value); if (n) hit(n); else err('Ungültige Nummer. Prüfziffer passt nicht oder Länge stimmt nicht.'); };
  $('#scIn', d).onkeydown = e => { if (e.key === 'Enter') $('#scOk', d).click(); };
  $('#scPic', d).onclick = async () => {
    const file = await gg.pickFile('image/*', 'environment'); if (!file || !alive) return;
    $('#scErr', d).className = 'prev'; $('#scErr', d).textContent = 'Bild wird gelesen …';
    try { const n = await decodeImage(file); if (n) hit(n); else err('Kein Barcode erkannt. Versuch es scharf und von nah, oder tipp die Nummer ein.'); }
    catch (e) { err('Bild konnte nicht gelesen werden.'); }
  };
  if (!cam) return d;
  const det = await getDetector();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    if (!alive) { stop(); return d; }
    v.srcObject = stream; await v.play().catch(() => {});
    stx('Barcode in den Rahmen halten');
  } catch (e) {
    const nm = e && e.name;
    noCam(nm === 'NotAllowedError' || nm === 'SecurityError' ? 'Kamera-Zugriff ist nicht erlaubt. Du kannst ihn in den Browser-Einstellungen freigeben, ein Foto vom Barcode wählen oder die Nummer eintippen.'
      : nm === 'NotFoundError' || nm === 'OverconstrainedError' ? 'Keine Kamera gefunden. Wähl ein Foto vom Barcode oder tipp die Nummer ein.'
      : 'Die Kamera ließ sich nicht starten. Wähl ein Foto vom Barcode oder tipp die Nummer ein.');
    return d;
  }
  const tick = async () => {
    if (!alive) return;
    if (!busy && v.readyState >= 2 && v.videoWidth) {
      busy = true;
      try {
        if (det) { for (const b of await det.detect(v)) { const n = normCode(b.rawValue, b.format); if (n) { busy = false; return hit(n); } } }
        else {
          const w = v.videoWidth, h = v.videoHeight;
          const n = zxCanvas(drawTo(v, w, h, 900, false, [0, Math.round(h * 0.28), w, Math.round(h * 0.44)]), false);
          if (n && n === last) { busy = false; return hit(n); } last = n || last;
        }
      } catch (e) { /* nächster Versuch */ }
      busy = false;
    }
    timer = setTimeout(tick, det ? 120 : 160);
  };
  tick();
  return d;
}

  let sub = (it.kind === 'vd' ? 'Zu verbrauchen bis ' : 'MHD ') + gg.date(it.date);
  if (it.openedAt) sub += '<br>Geöffnet am ' + gg.date(it.openedAt) + (+it.openDays > 0 ? ', ' + it.openDays + (+it.openDays === 1 ? ' Tag' : ' Tage') + ' haltbar' + (op ? ': gilt bis ' + gg.date(e) : '') : '');
  const hint = n < 0 ? (it.kind === 'vd'
    ? '<div class="hint">' + ic('alert') + '<span><b>Nicht mehr essen.</b> Das Verbrauchsdatum ist überschritten.</span></div>'
    : '<div class="hint">' + ic('alert') + '<span>MHD überschritten, oft noch gut. <b>Prüfen: sehen, riechen, schmecken.</b></span></div>') : '';
  const multi = it.qty > 1;
  const d = gg.sheet(it.name,
    '<div class="ihead">' + thumb(it, c) + '<div><div class="s"><span class="chip">' + PL[it.place] + '</span><span class="chip">' + KIND[it.kind] + '</span>' + (multi ? '<span class="chip ac">' + it.qty + ' Stück</span>' : '') + (it.demo ? '<span class="chip">Beispiel</span>' : '') + '</div></div></div>' +
    '<div class="istat ' + c + '"><div class="mid">' + big + '</div><div class="sub">' + sub + '</div>' + hint + '</div>' +
    (it.photo ? '<img class="iphoto" alt="" src="' + gg.blobUrl(it.id + ':' + (it.photoTs || 0), it.photo) + '">' : '') +
    (it.note ? '<p class="inote">' + esc(it.note) + '</p>' : '') +
    (multi ? '<div class="seg" id="iq" style="margin-bottom:10px"><button data-v="1" class="on">1 Stück</button><button data-v="all">alle ' + it.qty + '</button></div>' : '') +
    '<div class="acts"><button class="btn okb" data-a="used">' + ic('check') + 'Verbraucht</button><button class="btn wab" data-a="waste">' + ic('bin') + 'Weggeworfen</button>' +
    '<button class="btn" data-a="open">' + ic('open') + (it.openedAt ? 'Geöffnet ändern' : 'Geöffnet') + '</button><button class="btn" data-a="edit">' + ic('edit') + 'Bearbeiten</button></div>' +
    '<button class="btn ghost block dangerlink" data-a="del" style="color:var(--ba)">' + ic('trash') + 'Löschen, ohne zu zählen</button>');
  let all = false;
  $$('#iq button', d).forEach(b => b.onclick = () => { all = b.dataset.v === 'all'; $$('#iq button', d).forEach(x => x.classList.toggle('on', x === b)); });
  $$('[data-a]', d).forEach(b => b.onclick = async () => {
    const a = b.dataset.a;
    if (a === 'used' || a === 'waste') { d.close(); await consume(it, a, all ? it.qty : 1); }
    else if (a === 'open') { d.close(); openOpened(it); }
    else if (a === 'edit') { d.close(); openForm(it); }
    else if (a === 'del') { d.close(); if (await gg.confirm('„' + it.name + '“ löschen? Es wird nicht in der Statistik gezählt.')) { await db.del('items', it.id); await refresh(); gg.toast('Gelöscht'); } }
  });
}
async function consume(it, type, n) {
  const snap = { ...it }; n = Math.min(n, it.qty);
  const entry = { id: gg.uid(), ts: Date.now(), day: today(), type, name: it.name, place: it.place, kind: it.kind, qty: n, code: it.code || '', demo: !!it.demo };
  await db.put('log', entry);
  const left = it.qty - n;
  if (left > 0) await db.put('items', { ...it, qty: left }); else await db.del('items', it.id);
  await refresh();
  const what = type === 'used' ? 'verbraucht' : 'weggeworfen';
  undoToast(it.name + ' ' + what + (left > 0 ? ', noch ' + left : ''), async () => { await db.put('items', snap); await db.del('log', entry.id); await refresh(); });
}
function openOpened(it) {
  const mem = S.products.find(p => p.id === pid(it.code, it.name));
  const pre = it.openDays || (mem && mem.openDays) || '';
  const d = gg.sheet('Geöffnet',
    '<p class="small muted" style="margin:0 0 14px">Viele Packungen sagen, wie lange der Inhalt nach dem Öffnen hält. vorrat. nimmt dann das frühere Datum.</p>' +
    '<div class="field"><span>Geöffnet am</span>' + dateInput('oA', today()) + '<div class="qgrid" id="oDay" style="grid-template-columns:repeat(3,1fr)"><button type="button" data-v="0">heute</button><button type="button" data-v="-1">gestern</button><button type="button" data-v="-2">vorgestern</button></div></div>' +
    '<div class="field"><span>Danach haltbar (Tage)</span><input id="oD" class="mono" inputmode="numeric" placeholder="steht oft auf der Packung" maxlength="3" autocomplete="off">' +
    '<div class="qgrid" id="oQ">' + [1, 2, 3, 5, 7, 14].map(v => '<button type="button" data-v="' + v + '">' + v + (v === 1 ? ' Tag' : ' Tage') + '</button>').join('') + '</div></div>' +
    '<div class="note" id="oP"></div>' +
    '<div class="btns">' + (it.openedAt ? '<button class="btn" id="oR">Nicht geöffnet</button>' : '') + '<button class="btn primary" id="oS">Speichern</button></div>');
  const D = $('#oD', d); const A = bindDate(d, 'oA', it.openedAt || today(), () => upd()); D.value = pre;
  $$('#oDay button', d).forEach(b => b.onclick = () => { A.set(gg.addDays(today(), +b.dataset.v)); });
  const upd = () => {
    $$('#oDay button', d).forEach(b => b.classList.toggle('on', A.value === gg.addDays(today(), +b.dataset.v)));
    const days = parseInt(D.value, 10);
    $$('#oQ button', d).forEach(b => b.classList.toggle('on', +b.dataset.v === days));
    const P = $('#oP', d);
    if (!A.value || !(days > 0)) { P.innerHTML = 'Ohne Tage wird es nur als geöffnet markiert. Es gilt weiter ' + (it.kind === 'vd' ? 'das Verbrauchsdatum' : 'das MHD') + ' <b>' + gg.date(it.date) + '</b>.'; return; }
    const o = gg.addDays(A.value, days);
    P.innerHTML = o < it.date ? 'Gilt dann bis <b>' + gg.date(o) + '</b>, früher als ' + (it.kind === 'vd' ? 'das Verbrauchsdatum' : 'das MHD') + ' ' + gg.date(it.date) + '.' : 'Es bleibt beim früheren Datum <b>' + gg.date(it.date) + '</b>.';
  };
  D.oninput = upd;
  $$('#oQ button', d).forEach(b => b.onclick = () => { D.value = b.dataset.v; upd(); });
  upd();
  $('#oS', d).onclick = async () => {
    if (!A.value) { gg.toast('Wann geöffnet?'); return; }
    if (A.value > today()) { gg.toast('Das Datum liegt in der Zukunft'); return; }
    const days = parseInt(D.value, 10) || '';
    await db.put('items', { ...it, openedAt: A.value, openDays: days });
    if (days) { const p = S.products.find(x => x.id === pid(it.code, it.name)); if (p) await db.put('products', { ...p, openDays: days }); }
    d.close(); await refresh(); gg.toast('Als geöffnet markiert');
  };
  if ($('#oR', d)) $('#oR', d).onclick = async () => { await db.put('items', { ...it, openedAt: '', openDays: '' }); d.close(); await refresh(); gg.toast('Nicht mehr geöffnet'); };
}
let ut;
function undoToast(msg, fn) {
  let el = $('.utoast'); if (!el) { el = document.createElement('div'); el.className = 'utoast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = '<span>' + esc(msg) + '</span><button type="button">Rückgängig</button>';
  el.classList.add('on'); clearTimeout(ut);
  el.querySelector('button').onclick = async () => { clearTimeout(ut); el.classList.remove('on'); await fn(); gg.toast('Rückgängig gemacht'); };
  ut = setTimeout(() => el.classList.remove('on'), 5000);
}

/* ---------- Erinnerungen ---------- */
async function remind(force) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return false;
  const t = today(); if (!force && S.set.lastNotify === t) return false;
  const due = S.items.map(i => ({ i, s: st(i) })).filter(x => x.s.d <= S.set.soon).sort((a, b) => a.s.d - b.s.d);
  if (!due.length) { if (force) gg.toast('Gerade läuft nichts bald ab'); return false; }
  const exp = due.filter(x => x.s.d < 0).length, soon = due.length - exp;
  const title = soon ? soon + (soon === 1 ? ' Sache läuft' : ' Sachen laufen') + ' bald ab' : exp + (exp === 1 ? ' Sache ist' : ' Sachen sind') + ' abgelaufen';
  let body = due.slice(0, 4).map(x => x.i.name).join(', ') + (due.length > 4 ? ' und ' + (due.length - 4) + ' mehr' : '');
  if (soon && exp) body += '. Dazu ' + exp + ' schon abgelaufen.';
  const o = { body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'vorrat-taeglich', lang: 'de' };
  try {
    const reg = 'serviceWorker' in navigator ? await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(r, 1500))]) : null;
    if (reg && reg.showNotification) await reg.showNotification(title, o); else new Notification(title, o);
  } catch (e) { return false; }
  S.set.lastNotify = t; await saveSet(); return true;
}

/* ---------- Export und Sicherung ---------- */
const stamp = () => today();
function exportICS() {
  const t = today(), end = gg.addDays(t, 60);
  const ev = S.items.map(i => ({ i, e: eff(i) })).filter(x => x.e >= t && x.e <= end).sort((a, b) => a.e.localeCompare(b.e)).map(({ i, e }) => ({
    uid: 'vorrat-' + i.id, date: e, alarm: [1],
    title: i.kind === 'vd' ? i.name + ': zu verbrauchen bis heute' : i.name + ': MHD heute',
    desc: 'Ort: ' + PL[i.place] + (i.qty > 1 ? '. Menge: ' + i.qty : '') + '. ' + (i.kind === 'vd' ? 'Verbrauchsdatum, danach nicht mehr essen.' : 'MHD, danach oft noch gut: sehen, riechen, schmecken.') + (i.openedAt ? ' Geöffnet am ' + gg.date(i.openedAt) + '.' : '') + ' Aus vorrat.'
  }));
  if (!ev.length) { gg.toast('In den nächsten 60 Tagen läuft nichts ab'); return; }
  gg.shareFile('vorrat-ablaufdaten.ics', gg.ics('vorrat.', ev), 'text/calendar');
  gg.toast(ev.length + (ev.length === 1 ? ' Termin' : ' Termine') + ' exportiert');
}
function exportCSV() {
  const rows = [['Name', 'Barcode', 'Ort', 'Art', 'Datum', 'Gilt bis', 'Tage übrig', 'Menge', 'Geöffnet am', 'Nach Öffnen haltbar (Tage)', 'Notiz']];
  S.items.slice().sort((a, b) => eff(a).localeCompare(eff(b))).forEach(i => rows.push([i.name, i.code || '', PL[i.place], KIND[i.kind], gg.date(i.date), gg.date(eff(i)), st(i).d, i.qty, i.openedAt ? gg.date(i.openedAt) : '', i.openDays || '', i.note || '']));
  gg.shareFile('vorrat-' + stamp() + '.csv', gg.csv(rows), 'text/csv');
}
function exportLog() {
  const rows = [['Datum', 'Aktion', 'Name', 'Ort', 'Menge']];
  S.log.slice().sort((a, b) => a.ts - b.ts).forEach(l => rows.push([gg.date(l.day), l.type === 'used' ? 'verbraucht' : 'weggeworfen', l.name, PL[l.place] || '', l.qty || 1]));
  gg.shareFile('vorrat-verlauf-' + stamp() + '.csv', gg.csv(rows), 'text/csv');
}

/* ---------- Beispiel ---------- */
async function loadDemo() {
  const t = today(), A = n => gg.addDays(t, n);
  const I = [
    ['Hackfleisch gemischt', 'kuehl', 'vd', A(-1), 1, { added: A(-3) }],
    ['Joghurt Natur', 'kuehl', 'mhd', A(-2), 2, { added: A(-16) }],
    ['Lachsfilet', 'kuehl', 'vd', A(0), 1, { added: A(-2) }],
    ['Frische Vollmilch', 'kuehl', 'mhd', A(6), 1, { openedAt: A(-2), openDays: 3, added: A(-4) }],
    ['Hähnchenbrustfilet', 'kuehl', 'vd', A(2), 1, { added: A(-1) }],
    ['Gouda in Scheiben', 'kuehl', 'mhd', A(4), 1, { added: A(-10) }],
    ['Vollkornbrot', 'sonst', 'mhd', A(3), 1, { note: 'liegt im Brotkasten', added: A(-1) }],
    ['Haferflocken', 'vorrat', 'mhd', A(6), 1, { added: A(-200) }],
    ['Eier', 'kuehl', 'mhd', A(12), 6, { added: A(-4) }],
    ['Pizza Margherita', 'gefrier', 'mhd', A(40), 2, { added: A(-30) }],
    ['Tomaten passiert', 'vorrat', 'mhd', gg.addMonths(t, 4), 3, { added: A(-20) }],
    ['Erbsen tiefgekühlt', 'gefrier', 'mhd', gg.addMonths(t, 8), 1, { added: A(-60) }],
    ['Spaghetti', 'vorrat', 'mhd', gg.addMonths(t, 14), 2, { added: A(-30) }]
  ];
  for (const [name, place, kind, date, qty, x] of I) {
    const it = { id: gg.uid(), name, code: '', place, kind, date, qty, photo: null, note: '', openedAt: '', openDays: '', added: t, demo: true, ...x };
    await db.put('items', it);
    await db.put('products', { id: pid('', name), code: '', name, place, kind, shelf: Math.max(1, gg.days(it.added, date)), openDays: it.openDays || 0, uses: 2, last: t, demo: true });
  }
  // Verlauf der letzten Monate: [Monate zurück, Tag, Name, Ort, Art]
  const used = ['Frische Vollmilch', 'Joghurt Natur', 'Gouda in Scheiben', 'Vollkornbrot', 'Eier', 'Hähnchenbrustfilet', 'Salat', 'Spaghetti', 'Lachsfilet', 'Tomaten passiert', 'Hackfleisch gemischt', 'Pizza Margherita'];
  const waste = [[0, 'Salat'], [0, 'Vollkornbrot'], [1, 'Salat'], [1, 'Joghurt Natur'], [2, 'Frische Vollmilch'], [3, 'Salat'], [4, 'Vollkornbrot'], [5, 'Gurke']];
  const perMonth = [5, 9, 7, 8, 6, 7];
  const day = (m, k) => { const b = gg.addMonths(t.slice(0, 7) + '-01', -m); const dd = Math.min(1 + (k * 5) % 27, m === 0 ? +t.slice(8) - 1 : 27); return b.slice(0, 8) + String(Math.max(1, dd)).padStart(2, '0'); };
  let n = 0;
  for (let m = 0; m < 6; m++) for (let k = 0; k < perMonth[m]; k++) { const nm = used[(n++ * 7 + m) % used.length]; await db.put('log', { id: gg.uid(), ts: Date.now() - m * 2592e6 - k * 1e5, day: day(m, k), type: 'used', name: nm, place: 'kuehl', kind: 'mhd', qty: 1, demo: true }); }
  for (const [m, nm] of waste) await db.put('log', { id: gg.uid(), ts: Date.now() - m * 2592e6, day: day(m, 3 + m), type: 'waste', name: nm, place: 'kuehl', kind: 'mhd', qty: 1, demo: true });
  await refresh(); gg.toast('Beispiel geladen');
}
async function removeDemo() {
  for (const s of ['items', 'log', 'products']) for (const r of await db.all(s)) if (r.demo) await db.del(s, r.id);
  await refresh(); gg.toast('Beispiel entfernt');
}

/* ---------- Globale Ereignisse ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-id],[data-place],[data-tab]'); if (!t) return;
  if (t.dataset.tab) { ui.tab = t.dataset.tab; window.scrollTo(0, 0); render(); return; }
  if (t.dataset.place) { ui.place = t.dataset.place; render(); return; }
  if (t.dataset.id) { const it = S.items.find(i => i.id === t.dataset.id); if (it) openItem(it); return; }
  const a = t.dataset.act;
  if (a === 'first') openForm();
  else if (a === 'demo') loadDemo();
  else if (a === 'undemo') { if (await gg.confirm('Alle Beispieldaten entfernen? Deine eigenen Einträge bleiben.', 'Entfernen')) removeDemo(); }
  else if (a === 'ics') exportICS();
  else if (a === 'csv') { if (!S.items.length) return gg.toast('Noch nichts im Vorrat'); exportCSV(); }
  else if (a === 'csvlog') { if (!S.log.length) return gg.toast('Noch kein Verlauf'); exportLog(); }
  else if (a === 'bexp') { gg.shareFile('vorrat-sicherung-' + stamp() + '.json', await gg.backupExport('vorrat', db), 'application/json'); }
  else if (a === 'bimp') {
    const f = await gg.pickFile('.json,application/json'); if (!f) return;
    if (!await gg.confirm('Sicherung laden? Die Daten auf diesem Gerät werden ersetzt.', 'Laden', false)) return;
    try { await gg.backupImport('vorrat', db, await f.text()); await refresh(); setTheme(document.documentElement.dataset.theme); gg.toast('Sicherung geladen'); } catch (er) { gg.toast(er.message || 'Datei nicht lesbar'); }
  }
  else if (a === 'pclear') { if (await gg.confirm('Alle gemerkten Produkte vergessen? Dein Vorrat bleibt.', 'Leeren')) { await db.clear('products'); await refresh(); gg.toast('Gedächtnis geleert'); } }
  else if (a === 'wipe') { if (await gg.confirm('Wirklich alles löschen? Das lässt sich nicht rückgängig machen.', 'Alles löschen')) { for (const s of db.names) await db.clear(s); ui.place = 'all'; ui.q = ''; await refresh(); gg.toast('Alles gelöscht'); } }
  else if (a === 'nperm') { try { const p = await Notification.requestPermission(); if (p === 'granted') await remind(true); } catch (er) {} renderMore(); }
  else if (a === 'ntest') { if (await remind(true)) gg.toast('Benachrichtigung gesendet'); }
});
$('#fab').innerHTML = gg.icon('plus');
$$('.tabs [data-i]').forEach(s => s.outerHTML = ic(s.dataset.i));
$('#fab').onclick = () => openForm();
$('#bSearch').onclick = () => { ui.search = !ui.search; if (!ui.search) ui.q = ''; render(); if (ui.search) { const q = $('#q'); q && q.focus(); } };
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && db) { if (today() !== lastDay) { lastDay = today(); } refresh().then(() => remind(false)); } });

/* ---------- Start ---------- */
setTheme(gg.theme());
db = await gg.openDB('vorrat', ['items', 'products', 'log', 'meta']);
await refresh();
gg.sw();
remind(false);
window.vorrat = { decodeImage, normCode, parseDate, gtinOk, upcE2A, eff, refresh, state: S };
})();
